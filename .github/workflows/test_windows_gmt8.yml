name: Test Windows

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  page_build:
  release:
    types:
      - created

permissions: {}

jobs:
  test_windows_gmt8:
    runs-on: windows-latest
    name: Test GMT +8 on Windows
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set Timezone to +8 (With input)
        uses: ./
        with:
          timezoneWindows: "Singapore Standard Time"
      - run: npm i
      - run: npm run test
